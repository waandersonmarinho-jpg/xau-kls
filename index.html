<body>
<!-- ===== Login (Firebase Authentication, e-mail e senha) ===== -->
<style>
body.kls-locked>*:not(#klsAuth){display:none!important}
#klsAuth{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 16px;overflow:auto;font-family:var(--f-body);color:var(--fg)}
#klsAuth[hidden]{display:none!important}
.ka-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px 22px;display:flex;flex-direction:column;gap:14px}
.ka-logo{font:700 30px var(--f-display);letter-spacing:.02em;text-align:center}.ka-logo span{color:var(--gold)}
.ka-sub{font-size:13px;color:var(--muted);text-align:center;margin-top:-8px}
.ka-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:12px;background:var(--panel2)}
.ka-tabs button{font:600 14px var(--f-body);border:0;border-radius:9px;padding:10px;background:none;color:var(--muted);cursor:pointer}
.ka-tabs button.on{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.ka-f{display:flex;flex-direction:column;gap:5px}.ka-f label{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.ka-f input{font:500 16px var(--f-body);padding:12px 13px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);outline:none}
.ka-f input:focus{border-color:var(--gold)}
.ka-btn{font:600 15px var(--f-body);border:0;border-radius:11px;padding:13px;background:var(--gold);color:#000;cursor:pointer}
.ka-btn:disabled{opacity:.6}
.ka-link{font:500 13px var(--f-body);background:none;border:0;color:var(--gold);cursor:pointer;padding:2px;align-self:center}
.ka-msg{font-size:13px;line-height:1.45;border-radius:10px;padding:10px 12px;background:var(--panel2)}
.ka-msg.err{color:var(--bear);background:var(--bear-soft)}.ka-msg.ok{color:var(--bull);background:var(--bull-soft)}
#klsUser{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:9000;display:flex;align-items:center;gap:8px;font:500 12px var(--f-body);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:5px 6px 5px 12px;color:var(--muted);max-width:80vw}
#klsUser span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#klsUser button{font:600 12px var(--f-body);border:0;border-radius:14px;padding:5px 10px;background:var(--panel2);color:var(--fg);cursor:pointer}
</style>
<div id="klsAuth" hidden>
  <form class="ka-card" id="kaForm" novalidate>
    <div class="ka-logo">XAU/<span>KLS</span></div>
    <div class="ka-sub" id="kaSub">Entre para acessar o app</div>
    <div class="ka-tabs" id="kaTabs"><button type="button" data-m="in" class="on">Entrar</button><button type="button" data-m="up">Criar conta</button></div>
    <div class="ka-f" id="kaNameF" hidden><label for="kaName">Nome</label><input id="kaName" autocomplete="name"></div>
    <div class="ka-f"><label for="kaEmail">E-mail</label><input id="kaEmail" type="email" autocomplete="email" inputmode="email" required></div>
    <div class="ka-f" id="kaPassF"><label for="kaPass">Senha</label><input id="kaPass" type="password" autocomplete="current-password" minlength="6" required></div>
    <div class="ka-f" id="kaPass2F" hidden><label for="kaPass2">Repita a senha</label><input id="kaPass2" type="password" autocomplete="new-password"></div>
    <div class="ka-msg" id="kaMsg" hidden></div>
    <button class="ka-btn" id="kaGo" type="submit">Entrar</button>
    <button class="ka-link" id="kaForgot" type="button">Esqueci a senha</button>
    <button class="ka-link" id="kaResend" type="button" hidden>Reenviar e-mail de confirmação</button>
    <button class="ka-link" id="kaOut" type="button" hidden>Usar outra conta</button>
  </form>
</div>
<div id="klsUser" hidden><span id="klsUserMail"></span><button type="button" id="klsLogout">Sair</button></div>
<script>
/* Cole aqui o firebaseConfig do seu projeto. Enquanto estiver null, o app abre sem login. */
const KLS_FIREBASE=null;
(function(){
  if(!KLS_FIREBASE) return;
  const $=id=>document.getElementById(id), box=$('klsAuth');
  document.body.classList.add('kls-locked'); box.hidden=false;
  let mode='in';
  const ERR={'auth/invalid-email':'E-mail inválido.','auth/missing-password':'Digite a senha.','auth/weak-password':'A senha precisa ter pelo menos 6 caracteres.',
    'auth/email-already-in-use':'Esse e-mail já tem conta. Toque em "Entrar".','auth/invalid-credential':'E-mail ou senha incorretos.','auth/wrong-password':'E-mail ou senha incorretos.',
    'auth/user-not-found':'Não existe conta com esse e-mail.','auth/user-disabled':'Essa conta foi bloqueada pelo administrador.','auth/too-many-requests':'Muitas tentativas. Espere alguns minutos.',
    'auth/network-request-failed':'Sem conexão com a internet.','auth/unauthorized-domain':'Este site não está autorizado no Firebase (Domínios autorizados).'};
  const msg=(t,k)=>{ const m=$('kaMsg'); m.hidden=!t; m.textContent=t||''; m.className='ka-msg'+(k?' '+k:''); };
  const busy=b=>{ $('kaGo').disabled=b; };
  function setMode(m){ mode=m; msg('');
    document.querySelectorAll('#kaTabs button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
    $('kaTabs').hidden=m==='verify'; $('kaNameF').hidden=m!=='up'; $('kaPass2F').hidden=m!=='up'; $('kaPassF').hidden=m==='verify';
    $('kaEmail').closest('.ka-f').hidden=m==='verify'; $('kaForgot').hidden=m!=='in'; $('kaResend').hidden=m!=='verify'; $('kaOut').hidden=m!=='verify';
    $('kaPass').autocomplete=m==='up'?'new-password':'current-password';
    $('kaGo').textContent=m==='up'?'Criar conta':m==='verify'?'Já confirmei':'Entrar';
    $('kaSub').textContent=m==='up'?'Crie sua conta de estudo':m==='verify'?'Confirme seu e-mail':'Entre para acessar o app'; }
  $('kaTabs').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) setMode(b.dataset.m); });
  function load(src){ return new Promise((ok,no)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=no; document.head.appendChild(s); }); }
  const V='10.14.1', G='https://www.gstatic.com/firebasejs/'+V+'/', J='https://cdn.jsdelivr.net/npm/firebase@'+V+'/';
  const libs=base=>load(base+'firebase-app-compat.js').then(()=>load(base+'firebase-auth-compat.js'));
  msg('Carregando…');
  (window.firebase&&firebase.auth?Promise.resolve():libs(G).catch(()=>libs(J))).then(()=>{
    if(!firebase.apps.length) firebase.initializeApp(KLS_FIREBASE);
    const auth=firebase.auth(); auth.languageCode='pt';
    msg('');
    auth.onAuthStateChanged(u=>{
      if(u&&u.emailVerified){ box.hidden=true; document.body.classList.remove('kls-locked'); $('klsUser').hidden=false; $('klsUserMail').textContent=u.displayName||u.email; window.dispatchEvent(new Event('resize')); }
      else { box.hidden=false; document.body.classList.add('kls-locked'); $('klsUser').hidden=true;
        if(u){ setMode('verify'); msg('Enviamos um link de confirmação para '+u.email+'. Abra o e-mail (veja também o spam), toque no link e depois toque em "Já confirmei".','ok'); }
        else if(mode==='verify') setMode('in'); }
    });
    $('kaForm').addEventListener('submit',async e=>{ e.preventDefault(); msg(''); busy(true);
      const em=$('kaEmail').value.trim(), pw=$('kaPass').value;
      try{
        if(mode==='in'){ await auth.signInWithEmailAndPassword(em,pw); }
        else if(mode==='up'){
          if(pw!==$('kaPass2').value){ msg('As senhas não são iguais.','err'); return; }
          const c=await auth.createUserWithEmailAndPassword(em,pw); const nm=$('kaName').value.trim();
          if(nm) await c.user.updateProfile({displayName:nm});
          await c.user.sendEmailVerification(); setMode('verify');
          msg('Conta criada! Enviamos um link de confirmação para '+em+'. Abra o e-mail (veja também o spam), toque no link e depois toque em "Já confirmei".','ok'); }
        else { await auth.currentUser.reload(); if(auth.currentUser.emailVerified){ location.reload(); } else msg('Ainda não confirmado. Toque no link do e-mail e tente de novo.','err'); }
      }catch(x){ msg(ERR[x.code]||('Erro: '+(x.message||x)),'err'); }
      finally{ busy(false); } });
    $('kaForgot').addEventListener('click',async()=>{ const em=$('kaEmail').value.trim(); if(!em){ msg('Digite seu e-mail acima e toque em "Esqueci a senha".','err'); return; }
      try{ await auth.sendPasswordResetEmail(em); msg('Se existir conta com '+em+', enviamos um link para criar uma nova senha.','ok'); }catch(x){ msg(ERR[x.code]||x.message,'err'); } });
    $('kaResend').addEventListener('click',async()=>{ try{ await auth.currentUser.sendEmailVerification(); msg('E-mail reenviado para '+auth.currentUser.email+'.','ok'); }catch(x){ msg(ERR[x.code]||x.message,'err'); } });
    $('kaOut').addEventListener('click',()=>auth.signOut());
    $('klsLogout').addEventListener('click',()=>{ if(confirm('Sair da conta?')) auth.signOut(); });
  }).catch(()=>msg('Não foi possível carregar o login. Verifique a internet e recarregue a página.','err'));
})();
</script>
<!-- ===== fim do login ===== -->

    <details>
      <summary>Como o app decide uma queda</summary>
      <div class="how">
        <p><b>Níveis.</b> Cada topo e fundo confirmado vira um ponto. Pontos próximos (dentro da largura da zona) se juntam numa zona; cada ponto conta como um toque. Zona acima do preço é resistência, abaixo é suporte. Conforme o ouro sobe e faz novos topos, novas resistências aparecem sozinhas.</p>
        <p><b>Rejeição na resistência.</b> Candle de baixa que entra na zona por baixo, fecha abaixo dela e deixa pavio superior de pelo menos metade do corpo. Se a zona já foi suporte e foi perdida, aparece como <b>reteste</b>.</p>
        <p><b>Rompimento de suporte.</b> Candle de baixa com corpo forte que fecha abaixo de um suporte que vinha segurando o preço.</p>
        <p><b>Confiança do short (0 a 100%).</b> Soma de cinco notas: força da zona (até 25, mais toques = mais forte), candle de reversão (até 20, pavio superior longo ou corpo de baixa forte), tendência (20 se a EMA 50 está caindo, 6 se está subindo, porque vender contra a alta é mais arriscado), posição em relação à EMA 50 (até 15, preço esticado acima da média tende a corrigir) e risco/retorno até o próximo suporte (até 20, 3:1 ou mais ganha nota cheia). Acima de 70% é alta, 50 a 69% média, abaixo de 50% baixa. Toque num sinal da lista para ver as notas.</p>
        <p><b>Entrada por ordem stop.</b> Nenhum sinal entra no fechamento do candle. O app arma uma venda stop logo abaixo da linha (0,1 ATR) e a operação só acontece se o preço chegar lá. No rompimento de padrão ou de suporte, a ordem fica embaixo da linha. Na rejeição e no reteste, ela fica embaixo da mínima do candle de rejeição e vale por 3 candles; se o preço bater no stop loss antes, a ordem é cancelada. Se o mercado abrir com gap abaixo da ordem, a entrada sai no preço de abertura.</p>
        <p><b>Padrões gráficos de queda.</b> Triângulo descendente (suporte plano e topos caindo), topo duplo (dois topos parecidos e linha do pescoço), ombro-cabeça-ombro (cabeça mais alta entre dois ombros, linha do pescoço), cunha ascendente (fundos e topos subindo e se fechando), retângulo de baixa (lateral depois de uma queda), flâmula de baixa (queda forte e um triângulo pequeno) e triângulo simétrico rompendo para baixo. O app desenha as linhas do padrão. O stop loss segue a tabela de cada padrão e o alvo é a altura do padrão projetada a partir da linha rompida; na cunha, o alvo é o início da cunha. Depois do rompimento, um reteste da linha arma uma segunda venda stop.</p>
        <p><b>Stop e alvo.</b> Stop acima da zona (ou da máxima do candle) mais 0,2 ATR. Alvo no próximo suporte que dê pelo menos 1:1; sem suporte, alvo de 2R. Nada olha para o futuro: cada sinal usa só os candles que já tinham fechado.</p>
      </div>

      <summary>Como o app decide uma alta</summary>
      <div class="how">
        <p><b>Níveis.</b> Cada topo e fundo confirmado vira um ponto. Pontos próximos se juntam numa zona e cada ponto conta como um toque. Zona abaixo do preço é suporte, acima é resistência.</p>
        <p><b>Rejeição no suporte.</b> Candle de alta que entra na zona por cima, fecha acima dela e deixa pavio inferior de pelo menos metade do corpo. Se a zona já foi resistência e foi rompida, aparece como <b>reteste</b>.</p>
        <p><b>Rompimento de resistência.</b> O preço passa acima de uma resistência que vinha segurando a alta.</p>
        <p><b>Entrada por ordem stop.</b> Nenhum sinal entra no fechamento do candle. O app arma uma compra stop logo acima da linha (0,1 ATR) e a operação só acontece se o preço chegar lá. Na rejeição e no reteste, a ordem fica acima da máxima do candle de rejeição e vale por 3 candles; se o preço bater no stop loss antes, ela é cancelada.</p>
        <p><b>Padrões gráficos de alta.</b> Triângulo ascendente (resistência plana e fundos subindo), fundo duplo (dois fundos parecidos e linha do pescoço), OCO invertido (cabeça mais baixa entre dois ombros), cunha descendente (topos e fundos caindo e se fechando), retângulo de alta (lateral depois de uma alta), flâmula de alta (alta forte e um triângulo pequeno) e triângulo simétrico rompendo para cima. O app desenha as linhas do padrão; o stop loss fica abaixo do padrão e o alvo é a altura do padrão projetada para cima.</p>
        <p><b>Confiança do long (0 a 100%).</b> Soma de cinco notas: força da zona ou qualidade do padrão (até 25), fechamento depois do gatilho (até 20), tendência anterior (até 20), posição ou formato (até 15) e risco/retorno (até 20). Acima de 70% é alta, 50 a 69% média, abaixo de 50% baixa.</p>
        <p><b>Stop e alvo.</b> Stop abaixo da zona ou do padrão. O alvo segue a configuração da calculadora (padrão: 12% de lucro sobre a conta, contra stop de 2%). Nada olha para o futuro: cada sinal usa só os candles que já tinham fechado.</p>
      </div>
    </details>

/* ---------- leitura de CSV (MT5 / TradingView) ---------- */
function parseCSV(txt){
  const lines=txt.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  if(lines.length<30) throw new Error('Preciso de pelo menos 30 candles. Cole mais linhas.');
  const first=lines[0];
  const delim=first.includes('\t')?'\t':(first.split(';').length>first.split(',').length?';':',');
  const split=s=>s.split(delim).map(x=>x.trim().replace(/^"|"$/g,''));
  const num=s=>{if(s==null)return NaN; let v=s.replace(/\s/g,''); if(delim!==','&&/,\d+$/.test(v)&&!v.includes('.')) v=v.replace(',','.'); return parseFloat(v);};
  let head=split(first).map(h=>h.toLowerCase().replace(/[<>]/g,''));
  let idx={}, start=0;
  if(head.some(h=>/open|abert/.test(h))){
    start=1;
    head.forEach((h,i)=>{
      if(/^(open|abertura|abert)/.test(h)) idx.o=i; else if(/^(high|máx|max)/.test(h)) idx.h=i;
      else if(/^(low|mín|min)/.test(h)) idx.l=i; else if(/^(close|fech)/.test(h)) idx.c=i;
      else if(/^(date|data|time|datetime|hora)/.test(h)&&idx.d==null) idx.d=i;
      else if(/^(time|hora)/.test(h)&&idx.d!=null&&idx.tm==null) idx.tm=i;
    });
  }else{
    const n=split(first).length; const timeCol=/^\d{1,2}:\d{2}/.test(split(first)[1]||'');
    idx=timeCol?{d:0,tm:1,o:2,h:3,l:4,c:5}:{d:0,o:1,h:2,l:3,c:4};
    if(n<5) throw new Error('Cada linha precisa de data, abertura, máxima, mínima e fechamento.');
  }
  if([idx.o,idx.h,idx.l,idx.c].some(v=>v==null)) throw new Error('Não achei as colunas de abertura, máxima, mínima e fechamento no cabeçalho.');
  const out=[];
  for(let i=start;i<lines.length;i++){
    const r=split(lines[i]); const o=num(r[idx.o]),h=num(r[idx.h]),l=num(r[idx.l]),c=num(r[idx.c]);
    if(![o,h,l,c].every(isFinite)) continue;
    let t=(r[idx.d]||'')+(idx.tm!=null?' '+(r[idx.tm]||''):'');
    if(/^\d{9,10}$/.test(t.trim())){const dt=new Date(+t*1000);t=dt.toISOString().slice(5,16).replace('T',' ');}
    out.push({t:t.trim(),ts:toTs(t.trim()),o,h:Math.max(h,o,c),l:Math.min(l,o,c),c});
  }
  fixTimes(out);
  if(out.length<30) throw new Error('Só '+out.length+' linhas válidas. Confira o separador e as colunas.');
  return out;
}

function toTs(t){
  let m=t.match(/^(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})[ T]?(\d{1,2})?:?(\d{2})?/);
  if(m) return Date.UTC(+m[1],+m[2]-1,+m[3],+(m[4]||0),+(m[5]||0))/1000;
  m=t.match(/^(\d{1,2})[.\-\/](\d{1,2})[.\-\/](\d{4})[ T]?(\d{1,2})?:?(\d{2})?/);
  if(m) return Date.UTC(+m[3],+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0))/1000;
  const d=Date.parse(t); return isFinite(d)?Math.floor(d/1000):NaN;
}
function fixTimes(B){
  let ok=B.every((b,i)=>isFinite(b.ts)&&(i===0||b.ts>B[i-1].ts));
  if(!ok){ const base=Math.floor(Date.UTC(2026,0,1)/1000); B.forEach((b,i)=>b.ts=base+i*3600); }
}

function prep(){

  let a=0; for(let i=0;i<n;i++){const tr=i?Math.max(B[i].h-B[i].l,Math.abs(B[i].h-B[i-1].c),Math.abs(B[i].l-B[i-1].c)):B[i].h-B[i].l; a=i<14?(a*i+tr)/(i+1):(a*13+tr)/14; S.atr[i]=a;}
  const k=2/51; let e=B[0].c; for(let i=0;i<n;i++){e=i?B[i].c*k+e*(1-k):B[i].c; S.ema[i]=e;}
  const L=P.L; S.pivH=[]; S.pivL=[];
  for(let i=L;i<n-L;i++){
    let isH=true,isL=true;
    for(let j=i-L;j<=i+L;j++){ if(j===i)continue;
      if(j<i){ if(B[j].h>=B[i].h)isH=false; if(B[j].l<=B[i].l)isL=false; }
      else { if(B[j].h>B[i].h)isH=false; if(B[j].l<B[i].l)isL=false; } }
    if(isH)S.pivH.push(i); if(isL)S.pivL.push(i);

}
function zonesAt(t){

  for(const i of S.pivH) if(i<=t-R&&i>=from) pts.push({p:B[i].h,i,k:'H'});
  for(const i of S.pivL) if(i<=t-R&&i>=from) pts.push({p:B[i].l,i,k:'L'});
  pts.sort((x,y)=>x.p-y.p);
  const cl=[]; let cur=null;
  for(const q of pts){ if(cur&&q.p-cur.hiP<=tol&&q.p-cur.loP<=tol*1.6){cur.it.push(q);cur.hiP=q.p;} else {cur={it:[q],loP:q.p,hiP:q.p};cl.push(cur);} }

function symCore(t,W){const B=S.bars,a=S.atr[t]||1,{H,L}=pivW(t,W); if(H.length<2||L.length<2) return null;

/* ---------- conta demo e execução ---------- */
const SP=AS.sp;
let T={bal:null,pos:[],ord:[],hist:[],auto:false,seq:1};
try{const t=JSON.parse(localStorage.getItem(AS.pre+'xauq-t')||'null'); if(t&&Array.isArray(t.pos)) T=Object.assign(T,t);}catch(e){}
if(T.bal==null) T.bal=A.bal; if(!Array.isArray(T.ord)) T.ord=[];
const saveT=()=>{try{localStorage.setItem(AS.pre+'xauq-t',JSON.stringify(T));}catch(e){}};
const px=()=>S.bars[S.end].c;
const upl=(p,price)=>p.side==='sell'?(p.entry-(price+SP))*p.lots*100:(price-p.entry)*p.lots*100;
const mgn=p=>p.lots*100*p.entry/p.lev;
const fmt=v=>(v>0?'+':'')+usd(v);
function acct(){ const price=px(); let pl=0,mg=0; T.pos.forEach(p=>{pl+=upl(p,price);mg+=mgn(p);}); const eq=T.bal+pl; return {pl,mg,eq,free:eq-mg,lvl:mg?eq/mg*100:null}; }
let toastT=null;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,3200); }
function closePos(p,price,why){
  const pl=p.side==='sell'?(p.entry-price)*p.lots*100:(price-p.entry)*p.lots*100;
  T.bal+=pl; T.pos=T.pos.filter(q=>q!==p);
  T.hist.unshift({side:p.side,lots:p.lots,entry:p.entry,exit:price,pl,why,t:S.bars[S.end]?S.bars[S.end].t:''}); T.hist=T.hist.slice(0,30);
  saveT(); toast((why==='tp'?'Take profit':why==='sl'?'Stop loss':why==='so'?'Stop out por margem':'Posição fechada')+': '+fmt(pl));
}
function processTo(E){
  const B=S.bars; if(!B.length) return;
  for(const o of T.ord.slice()){
    for(let i=0;i<=E;i++){ const b0=B[i], same=b0.ts===o.lastTs; if(b0.ts<o.lastTs||(same&&i!==B.length-1)) continue; o.lastTs=b0.ts;
      const b=same?{o:b0.c,h:b0.c,l:b0.c,c:b0.c,ts:b0.ts,t:b0.t}:b0;
      if(o.side==='sell'?b.l<=o.px:b.h+SP>=o.px){
        const f=o.side==='sell'?Math.min(o.px,b.o):Math.max(o.px,b.o+SP); T.ord=T.ord.filter(q=>q!==o);
        let pl=0,mg=0; T.pos.forEach(q=>{pl+=upl(q,b.c);mg+=mgn(q);});
        if(o.lots*100*f/o.lev>T.bal+pl-mg){ toast('Ordem stop cancelada: margem insuficiente'); break; }
        T.pos.push({id:T.seq++,side:o.side,lots:o.lots,entry:f,sl:o.sl,tp:o.tp,lev:o.lev,lastTs:b.ts,t:b.t});
        toast((o.side==='sell'?'Venda':'Compra')+' stop executada: '+o.lots.toFixed(2)+' lote a '+fp(f)+(o.auto?' (automático)':'')); break; } } }
  for(const p of T.pos.slice()){
    for(let i=0;i<=E;i++){ const b0=B[i], same=b0.ts===p.lastTs; if(b0.ts<p.lastTs||(same&&i!==B.length-1)) continue;
      p.lastTs=b0.ts; const b=same?{o:b0.c,h:b0.c,l:b0.c,c:b0.c}:b0;
      if(p.side==='sell'){ if(b.h+SP>=p.sl){closePos(p,p.sl,'sl');break;} if(p.tp&&b.l+SP<=p.tp){closePos(p,p.tp,'tp');break;} }
      else { if(b.l<=p.sl){closePos(p,p.sl,'sl');break;} if(p.tp&&b.h>=p.tp){closePos(p,p.tp,'tp');break;} }
      // stop out: patrimônio abaixo de 50% da margem
      let pl=0,mg=0; T.pos.forEach(q=>{const w=q.side==='sell'?b.h:b.l; pl+=upl(q,w);mg+=mgn(q);});
      if(mg&&(T.bal+pl)<=mg*0.5){ T.pos.slice().forEach(q=>closePos(q,q.side==='sell'?b.h+SP:b.l,'so')); break; }
    }
  }
  saveT();
}

// fluxo agressivo da Binance só do lado deste app: Venda vê o volume vendido, Compra vê o volume comprado
function volSide(B,side){
  const sell=side==='sell', col=sell?'#e5484d':'#30a46c', cls=sell?'dn':'up', nome=sell?'vendido':'comprado';
  const q=b=>sell?b.v-b.tb:b.tb;
  const N=Math.min(60,B.length), seg=B.slice(-N), k=2/10, warm=B.slice(Math.max(0,B.length-N-30),B.length-N);
  let e=null; const E=[]; warm.concat(seg).forEach((b,i)=>{ const x=q(b); e=e==null?x:e+k*(x-e); if(i>=warm.length) E.push(e); });
  const sv=seg.map(q), V=seg.reduce((a,b)=>a+b.v,0), Q=sv.reduce((a,b)=>a+b,0), pct=V?Q/V*100:50;
  const W=360,H=170,pl=34,pr=70,pt=10,pb=20;
  const mx=Math.min(Math.max(...sv),Math.max(...E)*2.5)||1, X=i=>pl+(i+.5)*(W-pl-pr)/N, Y=v=>pt+(1-v/mx)*(H-pt-pb), bw=Math.max(1,(W-pl-pr)/N*.7);
  const nf=v=>v>=1000?(v/1000).toFixed(1).replace('.',',')+'k':v>=10?Math.round(v)+'':v.toFixed(1).replace('.',',');
  let g='';
  [0,.5,1].forEach(f=>{ const v=mx*f; g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)"/><text x="'+(pl-4)+'" y="'+(Y(v)+3)+'" text-anchor="end" font-size="8.5" fill="var(--muted)">'+nf(v)+'</text>'; });
  sv.forEach((v,i)=>{ v=Math.min(v,mx); g+='<rect x="'+(X(i)-bw/2)+'" y="'+Y(v)+'" width="'+bw+'" height="'+(Y(0)-Y(v))+'" fill="'+col+'" opacity=".28"/>'; });
  g+='<polyline fill="none" stroke="'+col+'" stroke-width="2.2" stroke-linejoin="round" points="'+E.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ')+'"/>';
  const last=E[N-1]; g+='<text x="'+(W-pr+6)+'" y="'+(Y(last)+3)+'" font-size="9.5" font-weight="700" fill="'+col+'">'+(sell?'Venda ':'Compra ')+nf(last)+'</text>';
  [0,Math.floor(N/2),N-1].forEach(i=>{ g+='<text x="'+X(i)+'" y="'+(H-6)+'" text-anchor="middle" font-size="8" fill="var(--muted)">'+(S.tf<86400?seg[i].t.slice(-5):seg[i].t.slice(0,5))+'</text>'; });
  const back=E[Math.max(0,N-11)], ch=back?(last/back-1)*100:0;
  const st=pct>=55?[cls,sell?'Vendedores no controle':'Compradores no controle']:pct<=45?['',sell?'Venda fraca':'Compra fraca']:['','Equilíbrio'];
  // grandes volumes só deste lado
  const avg=V/N, big=[]; for(let i=B.length-1;i>=Math.max(0,B.length-200)&&big.length<6;i--){ const b=B[i], x=q(b); if(b.v>2*avg&&x/b.v>=.55) big.push({t:b.t,p:b.c,x,pc:x/b.v*100}); }
  return '<div class="ibox"><div class="lab">Volume '+nome+' na Binance · últimos '+N+' candles de '+tfName(S.tf)+'</div>'+
    '<div class="ival '+st[0]+'">'+pct.toFixed(0)+'% do volume '+(sell?'é venda':'é compra')+' <small>'+st[1]+' · '+(ch>=0?'subindo +':'caindo ')+ch.toFixed(0)+'% em 10 candles</small></div>'+
    '<div class="meter"><i style="width:'+pct.toFixed(1)+'%;background:'+col+'"></i></div>'+
    '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Volume '+nome+' por candle">'+g+'</svg>'+
    '<div class="lgs"><span class="lg"><i style="background:'+col+'"></i><b>Volume '+nome+'</b> <span class="msg">· barras = cada candle; linha = média EMA 9</span></span></div>'+
    '<div class="msg">No período: <b class="'+cls+'">'+nf(Q)+' onças '+nome+'s a mercado</b>. Linha '+(sell?'vermelha':'verde')+' subindo = mais pressão '+(sell?'vendedora, que favorece os sinais de venda':'compradora, que favorece os sinais de compra')+'.</div>'+
    '<div class="lab" style="margin-top:12px">Grandes '+(sell?'vendas':'compras')+' (volume mais de 2× a média)</div>'+
    (big.length?big.map(x=>'<div class="irow"><span>'+x.t+'</span><span class="mono">'+fp(x.p)+'</span><span class="'+cls+'">'+nf(x.x)+' oz · '+x.pc.toFixed(0)+'%</span></div>').join(''):'<div class="msg">Nenhuma grande '+(sell?'venda':'compra')+' nos últimos candles.</div>')+'</div>';
}

function renderAcct(){
  if(!S.bars.length) return; const a=acct(), cl=v=>'val '+(v>0?'up':v<0?'dn':'');
  $('tEq').textContent=usd(a.eq); $('tBal').textContent=usd(T.bal);
  $('tPL').textContent=fmt(a.pl); $('tPL').className=cl(a.pl);
  $('tMg').textContent=usd(a.mg); $('tFree').textContent=usd(a.free);
  $('tLvl').textContent=a.lvl==null?'—':Math.round(a.lvl)+'%'; $('tLvl').className='val '+(a.lvl!=null&&a.lvl<150?'dn':'');
  const real=T.hist.reduce((s,h)=>s+h.pl,0); $('tReal').textContent=fmt(real); $('tReal').className=cl(real);
  const price=px(), tp=$('tPos'); tp.innerHTML='';

function parseCSV(txt){
  const lines=txt.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  if(lines.length<30) throw new Error('Preciso de pelo menos 30 candles. Cole mais linhas.');
  const first=lines[0];
  const delim=first.includes('\t')?'\t':(first.split(';').length>first.split(',').length?';':',');
  const split=s=>s.split(delim).map(x=>x.trim().replace(/^"|"$/g,''));
  const num=s=>{if(s==null)return NaN; let v=s.replace(/\s/g,''); if(delim!==','&&/,\d+$/.test(v)&&!v.includes('.')) v=v.replace(',','.'); return parseFloat(v);};
  let head=split(first).map(h=>h.toLowerCase().replace(/[<>]/g,''));
  let idx={}, start=0;
  if(head.some(h=>/open|abert/.test(h))){
    start=1;
    head.forEach((h,i)=>{
      if(/^(open|abertura|abert)/.test(h)) idx.o=i; else if(/^(high|máx|max)/.test(h)) idx.h=i;
      else if(/^(low|mín|min)/.test(h)) idx.l=i; else if(/^(close|fech)/.test(h)) idx.c=i;
      else if(/^(date|data|time|datetime|hora)/.test(h)&&idx.d==null) idx.d=i;
      else if(/^(time|hora)/.test(h)&&idx.d!=null&&idx.tm==null) idx.tm=i;
    });

    const n=split(first).length; const timeCol=/^\d{1,2}:\d{2}/.test(split(first)[1]||'');
    idx=timeCol?{d:0,tm:1,o:2,h:3,l:4,c:5}:{d:0,o:1,h:2,l:3,c:4};
    if(n<5) throw new Error('Cada linha precisa de data, abertura, máxima, mínima e fechamento.');
  }

  const out=[];
  for(let i=start;i<lines.length;i++){
    const r=split(lines[i]); const o=num(r[idx.o]),h=num(r[idx.h]),l=num(r[idx.l]),c=num(r[idx.c]);

const SP=AS.sp;

const saveT=()=>{try{localStorage.setItem(AS.pre+'xaukp-t',JSON.stringify(T));}catch(e){}};
const px=()=>S.bars[S.end].c;
const upl=(p,price)=>p.side==='sell'?(p.entry-(price+SP))*p.lots*100:(price-p.entry)*p.lots*100;
const mgn=p=>p.lots*100*p.entry/p.lev;
const fmt=v=>(v>0?'+':'')+usd(v);
function acct(){ const price=px(); let pl=0,mg=0; T.pos.forEach(p=>{pl+=upl(p,price);mg+=mgn(p);}); const eq=T.bal+pl; return {pl,mg,eq,free:eq-mg,lvl:mg?eq/mg*100:null}; }
let toastT=null;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,3200); }
function closePos(p,price,why){
  let pl=p.side==='sell'?(p.entry-price)*p.lots*100:(price-p.entry)*p.lots*100;
  if(why==='liq'&&p.mode!=='cross') pl=-mgn(p);
  T.bal+=pl; T.pos=T.pos.filter(q=>q!==p);
  if(p.gid){ T.ord=T.ord.filter(o=>o.gid!==p.gid); if(T.dcaG) delete T.dcaG[p.gid]; }
  T.hist.unshift({side:p.side,lots:p.lots,entry:p.entry,exit:price,pl,why,t:S.bars[S.end]?S.bars[S.end].t:''}); T.hist=T.hist.slice(0,30);
  saveT(); toast((why==='tp'?'Take profit':why==='sl'?'Stop loss':why==='liq'?'Liquidação':why==='so'?'Stop out por margem':'Posição fechada')+': '+fmt(pl));
}
function processTo(E){
  const B=S.bars; if(!B.length) return;
  let from=Infinity; T.ord.forEach(o=>from=Math.min(from,o.lastTs)); T.pos.forEach(p=>from=Math.min(from,p.lastTs));
  // candle a candle: primeiro as ordens, depois as posições (stop, liquidação, alvo)
  for(let i=0;i<=E;i++){ const b0=B[i]; if(b0.ts<from) continue; const isLast=i===B.length-1;
    for(const o of T.ord.slice()){ if(!T.ord.includes(o)) continue; const same=b0.ts===o.lastTs; if(b0.ts<o.lastTs||(same&&!isLast)) continue; o.lastTs=b0.ts;
      const b=same?{o:b0.c,h:b0.c,l:b0.c,c:b0.c,ts:b0.ts,t:b0.t}:b0, lim=o.type==='limit';
      if(!(lim?(o.side==='buy'?b.l+SP<=o.px:b.h>=o.px):(o.side==='sell'?b.l<=o.px:b.h+SP>=o.px))) continue;
      const f=lim?(o.side==='buy'?Math.min(o.px,b.o+SP):Math.max(o.px,b.o)):(o.side==='sell'?Math.min(o.px,b.o):Math.max(o.px,b.o+SP));
      T.ord=T.ord.filter(q=>q!==o);
      let pl=0,mg=0; T.pos.forEach(q=>{pl+=upl(q,b.c);mg+=mgn(q);});
      if(o.lots*100*f/o.lev>T.bal+pl-mg){ toast('Ordem cancelada: margem insuficiente'); continue; }
      if(o.gid&&T.dcaG&&T.dcaG[o.gid]){ fillDCA(T.dcaG[o.gid],o.k,f,b); continue; }
      T.pos.push({id:T.seq++,side:o.side,lots:o.lots,entry:f,sl:o.sl,tp:o.tp,lev:o.lev,lastTs:b.ts,t:b.t});
      toast((o.side==='sell'?'Venda':'Compra')+' stop executada: '+o.lots.toFixed(2)+' lote a '+fp(f)+(o.auto?' (automático)':'')); }
    for(const p of T.pos.slice()){ if(!T.pos.includes(p)) continue; const same=b0.ts===p.lastTs; if(b0.ts<p.lastTs||(same&&!isLast)) continue; p.lastTs=b0.ts;
      const b=same?{o:b0.c,h:b0.c,l:b0.c,c:b0.c}:b0;
      if(p.side==='sell'){ if(b.h+SP>=p.sl){closePos(p,p.sl,'sl');continue;} if(p.tp&&b.l+SP<=p.tp){closePos(p,p.tp,'tp');continue;} }
      else { if(p.sl&&b.l<=p.sl){closePos(p,p.sl,'sl');continue;} if(p.liq&&b.l<=p.liq){closePos(p,p.liq,'liq');continue;} if(p.tp&&b.h>=p.tp){closePos(p,p.tp,'tp');continue;} } }
    // stop out da conta: patrimônio abaixo de 50% da margem
    let pl=0,mg=0; T.pos.forEach(q=>{const w=q.side==='sell'?b0.h:b0.l; pl+=upl(q,w);mg+=mgn(q);});
    if(mg&&(T.bal+pl)<=mg*0.5) T.pos.slice().forEach(q=>closePos(q,q.side==='sell'?b0.h+SP:b0.l,'so'));
  }
  saveT();
}

function volSide(B,side){
  const sell=side==='sell', col=sell?'#e5484d':'#30a46c', cls=sell?'dn':'up', nome=sell?'vendido':'comprado';
  const q=b=>sell?b.v-b.tb:b.tb;

  let e=null; const E=[]; warm.concat(seg).forEach((b,i)=>{ const x=q(b); e=e==null?x:e+k*(x-e); if(i>=warm.length) E.push(e); });
  const sv=seg.map(q), V=seg.reduce((a,b)=>a+b.v,0), Q=sv.reduce((a,b)=>a+b,0), pct=V?Q/V*100:50;
  const W=360,H=170,pl=34,pr=70,pt=10,pb=20;

  sv.forEach((v,i)=>{ v=Math.min(v,mx); g+='<rect x="'+(X(i)-bw/2)+'" y="'+Y(v)+'" width="'+bw+'" height="'+(Y(0)-Y(v))+'" fill="'+col+'" opacity=".28"/>'; });
  g+='<polyline fill="none" stroke="'+col+'" stroke-width="2.2" stroke-linejoin="round" points="'+E.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ')+'"/>';
  const last=E[N-1]; g+='<text x="'+(W-pr+6)+'" y="'+(Y(last)+3)+'" font-size="9.5" font-weight="700" fill="'+col+'">'+(sell?'Venda ':'Compra ')+nf(last)+'</text>';

  // grandes volumes só deste lado
  const avg=V/N, big=[]; for(let i=B.length-1;i>=Math.max(0,B.length-200)&&big.length<6;i--){ const b=B[i], x=q(b); if(b.v>2*avg&&x/b.v>=.55) big.push({t:b.t,p:b.c,x,pc:x/b.v*100}); }

    'Take profit de '+String(D.tp).replace('.',',')+'% sobre o médio = ROE de '+Math.round(D.tp*D.lev)+'%: '+usdt(pf)+' se só a 1ª entrar, '+usdt(pall)+' com as '+D.n+'. '+
    'Margem total: '+usdt(l.mg)+'. Com todas as entradas, a liquidação fica em '+fp(l.liq)+' ('+((1-l.liq/b.p)*100).toFixed(2).replace('.',',')+'% abaixo da 1ª entrada)'+
    (pl.sl?'; stop loss em '+fp(pl.sl)+'.':D.mode==='cross'?'; na margem cruzada, sem stop loss, a liquidação pode levar o saldo inteiro da conta.':'; sem stop loss, a perda máxima é a margem total.');
  $('dOn').checked=!!D.on; $('dTrig').value=D.trig; $('dMode').value=D.mode;

function placeDCA(p0,ft,auto){
  const gid=T.seq++, pl=dcaPlan(p0); T.dcaG=T.dcaG||{};
  const g={gid,n:D.n,step:dStep(),m:D.m,lev:D.lev,tp:D.tp,sl:pl.sl,p0,mode:D.mode,all:ft==='limit'}; T.dcaG[gid]=g;
  const bar=S.bars[S.end];
  if(ft==='mkt') fillDCA(g,0,px()+SP,bar);
  else if(ft==='limit') for(let k=0;k<D.n;k++){ const pk=p0*(1-g.step/100*k); T.ord.push({id:T.seq++,side:'buy',type:'limit',lots:(D.m*D.lev/pk)/100,px:pk,sl:pl.sl,tp:null,lev:D.lev,lastTs:bar.ts,auto:!!auto,gid,k}); }
  else T.ord.push({id:T.seq++,side:'buy',type:'stop',lots:pl.rows[0].oz/100,px:p0,sl:pl.sl,tp:null,lev:D.lev,lastTs:bar.ts,auto:!!auto,gid,k:0});
  saveT(); if(!auto&&ft!=='mkt') toast(ft==='limit'?'DCA armado: '+D.n+' compras limite de '+fp(p0)+' até '+fp(p0*(1-g.step/100*(D.n-1))):'DCA armado: compra stop em '+fp(p0)+' + '+(D.n-1)+' compras limite');
}
function fillDCA(g,k,f,b){
  const oz=g.m*g.lev/f; let p=T.pos.find(q=>q.gid===g.gid);
  if(!p){ p={id:T.seq++,side:'buy',lots:oz/100,entry:f,sl:g.sl,tp:null,lev:g.lev,lastTs:b.ts,t:b.t,gid:g.gid,dca:true,n:1,of:g.n}; T.pos.push(p);
    if(!g.all) for(let j=1;j<g.n;j++){ const pj=g.p0*(1-g.step/100*j); T.ord.push({id:T.seq++,side:'buy',type:'limit',lots:(g.m*g.lev/pj)/100,px:pj,sl:g.sl,tp:null,lev:g.lev,lastTs:b.ts,auto:false,gid:g.gid,k:j}); } }
  else { const q0=p.lots*100; p.entry=(q0*p.entry+oz*f)/(q0+oz); p.lots=(q0+oz)/100; p.n++; }
  p.tp=p.entry*(1+g.tp/100); p.mode=g.mode; p.liq=liqOf(p.entry,p.lots*100,mgn(p),g.lev,g.mode,T.bal);
  toast('DCA '+p.n+'/'+g.n+' executada a '+fp(f)+' · preço médio '+fp(p.entry));
}
function autoArm(){
  if(!T.auto) return; T.ord=T.ord.filter(o=>!o.auto);
  if(T.dcaG) for(const k in T.dcaG){ if(!T.pos.some(p=>p.gid==k)&&!T.ord.some(o=>o.gid==k)) delete T.dcaG[k]; }
  if(T.pos.some(p=>p.side==='buy')||T.ord.some(o=>o.side==='buy'&&!o.auto)) { saveT(); return; }
  if(D.on&&D.trig==='dip'){ if(D.m*D.n<=acct().free) placeDCA(dcaBase().p,'limit',true); else saveT(); return; }
  const o=S.liveOrders&&S.liveOrders[0]; if(!o) { saveT(); return; }
  if(D.on&&D.trig!=='dip'){ if(D.m*D.n<=acct().free) placeDCA(o.px,'stop',true); else saveT(); return; }
  const lots=lotsFor(o.px,o.stop); if(lots*100*o.px/A.lev<=acct().free) placeOrder('buy',lots,o.px,o.stop,tgtFor(o.px,o.stop,o.target),true); else saveT();
}

/* ---------- fonte de preço real ----------
   Ouro: Binance Futuros XAUUSDT (perpétuo lançado em jan/2026); se falhar, Binance PAXGUSDT (ouro tokenizado).
   WIN/WDO: brapi.dev, histórico de futuros da B3 por fechamento de pregão (precisa de token gratuito). */
window.KLS_FEED=(function(){
  const IV={300:'5m',900:'15m',3600:'1h',14400:'4h',86400:'1d',604800:'1w'};
  const blocked='Dados de exemplo · o preço real carrega no site publicado (GitHub Pages)';
  async function getJSON(u){ const ac=('AbortController' in window)?new AbortController():null, to=setTimeout(()=>ac&&ac.abort(),8000);
    try{ const r=await fetch(u,{cache:'no-store',signal:ac?ac.signal:undefined}); if(!r.ok) throw new Error('HTTP '+r.status); return await r.json(); }
    catch(e){ if(e&&e.name==='AbortError') throw new Error('sem resposta em 8 s'); throw e; } finally{ clearTimeout(to); } }
  function wsSub(url,parse){ return cb=>{ let ws=null, stop=false, retry=null;
      const open=()=>{ try{ ws=new WebSocket(url); }catch(e){ return; }
        ws.onmessage=ev=>{ try{ const b=parse(JSON.parse(ev.data)); if(b) cb(b); }catch(e){} };
        ws.onclose=()=>{ if(!stop) retry=setTimeout(open,5000); }; };
      open(); return ()=>{ stop=true; clearTimeout(retry); try{ ws&&ws.close(); }catch(e){} }; }; }
  async function gold(tf){
    const iv=IV[tf]; let netErr=false;
    const tries=[
      {u:'https://fapi.binance.com/fapi/v1/klines?symbol=XAUUSDT&interval='+iv+'&limit=600',src:'Binance XAUUSDT',ws:'wss://fstream.binance.com/ws/xauusdt@kline_'+iv},
      {u:'https://api.binance.com/api/v3/klines?symbol=PAXGUSDT&interval='+iv+'&limit=600',src:'Binance PAXGUSDT',ws:'wss://stream.binance.com:9443/ws/paxgusdt@kline_'+iv}];
    for(const t of tries){
      try{ const a=await getJSON(t.u); if(!Array.isArray(a)||a.length<20) continue;
        const bars=a.map(k=>({ts:Math.floor(k[0]/1000),o:+k[1],h:+k[2],l:+k[3],c:+k[4],v:+k[5],tb:+k[9]})).filter(b=>isFinite(b.c));
        return {bars,src:t.src,sub:wsSub(t.ws,m=>{ const k=m.k; return k?{ts:Math.floor(k.t/1000),o:+k.o,h:+k.h,l:+k.l,c:+k.c,v:+k.v,tb:+k.V}:null; })}; }
      catch(e){ if(e instanceof TypeError) netErr=true; } }
    return {msg:netErr?blocked:'Dados de exemplo · a Binance não respondeu (tente no Wi-Fi)'};
  }
  const pickArr=j=>{ if(Array.isArray(j)) return j; if(!j) return null;
    for(const k of ['results','historical','data','candles','prices']) if(Array.isArray(j[k])) return (j[k][0]&&Array.isArray(j[k][0].historicalDataPrice))?j[k][0].historicalDataPrice:j[k];
    return null; };
  const num=v=>v==null||v===''?NaN:+v;
  function weekly(d){ const out=[]; let cur=null; for(const b of d){ const dt=new Date(b.ts*1000), mon=b.ts-((dt.getUTCDay()+6)%7)*86400; const k=mon-mon%86400;
      if(!cur||cur.ts!==k){ cur={ts:k,o:b.o,h:b.h,l:b.l,c:b.c}; out.push(cur); } else { cur.h=Math.max(cur.h,b.h); cur.l=Math.min(cur.l,b.l); cur.c=b.c; } } return out; }
  async function b3(as,tf){
    let tok=''; try{ tok=localStorage.getItem('kls-brapi')||''; }catch(e){}
    if(tf<86400) return {msg:'Dados de exemplo · na B3 o preço real vem por pregão: use 1D ou Semanal'};
    if(!tok) return {msg:'Dados de exemplo · cole seu token da brapi em Ajustes para ver o '+as.sym+' real'};
    const iso=d=>d.toISOString().slice(0,10), end=new Date(), st=new Date(Date.now()-420*864e5);
    const u='https://brapi.dev/api/v2/futures/historical?symbol='+encodeURIComponent(as.sym)+'&startDate='+iso(st)+'&endDate='+iso(end)+'&sortOrder=asc&token='+encodeURIComponent(tok);
    let j; try{ j=await getJSON(u); }catch(e){ return {msg:e instanceof TypeError?blocked:'Dados de exemplo · brapi recusou ('+e.message+'); confira o token'}; }
    const rows=pickArr(j); if(!rows) return {msg:'Dados de exemplo · resposta da brapi sem candles'};
    const bars=rows.map(r=>{ const d=r.date??r.tradeDate??r.referenceDate??r.sessionDate??r.datetime;
        let ts=typeof d==='number'?(d>1e12?d/1000:d):Date.parse(String(d).slice(0,10)+'T00:00:00Z')/1000;
        const o=num(r.open??r.openPrice??r.opening), h=num(r.high??r.max??r.maxPrice), l=num(r.low??r.min??r.minPrice), c=num(r.close??r.lastPrice??r.closingPrice??r.settlement??r.settlementPrice);
        return {ts:Math.floor(ts/86400)*86400,o:isFinite(o)?o:c,h:isFinite(h)?h:Math.max(o,c),l:isFinite(l)?l:Math.min(o,c),c}; })
      .filter(b=>isFinite(b.ts)&&isFinite(b.c)&&b.c>0).sort((a,b)=>a.ts-b.ts);
    if(bars.length<20) return {msg:'Dados de exemplo · poucos pregões do '+as.sym+' na brapi'};
    return {bars:tf===604800?weekly(bars):bars,src:'brapi · '+as.sym+' (fechamento do pregão)'};
  }
  return { bars:(as,tf)=>as.exch==='B3'?b3(as,tf):gold(tf) };
})();
